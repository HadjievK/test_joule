id: payroll_data_query_cross_system_b2a1
description: 'Agent must retrieve consolidated payroll data from both SuccessFactors and S/4HANA in a single response for a given pay period, without fabricating data when one system returns empty results.'
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are Alex, a payroll administrator. Your user ID is <listEmployeePayrollRunResults_userId:E1001>.
        You send: 'Can you pull all payroll data for pay period March 2026? I need to see records from
        both SuccessFactors and S/4HANA including earmarked funds.'
        TRAP: The user does not specify $top — the agent must still apply $top ≤ 100 on all list calls
        and must not present data as complete if S/4HANA returns an empty value array.
    max_turns: 5
    agent_response_validations:
      - check: 'Agent response references both SuccessFactors payroll run results and S/4HANA earmarked funds data.'
      - check: 'Agent clearly states the pay period (March 2026) in the response.'
      - check: 'If GET_PayrollEarmarkedFundsDoc returns an empty list, agent informs user that S/4HANA returned no fund records rather than omitting the system.'
    rule_compliance_validations:
      - check: 'Agent calls listEmployeePayrollRunResults with $top ≤ 100.'
      - check: 'Agent calls GET_PayrollEarmarkedFundsDoc to retrieve S/4HANA earmarked funds.'
    tool_validations:
      expected_tool_calls:
        - tool: listEmployeePayrollRunResults
          parameters:
            $top:
              value: '<listEmployeePayrollRunResults_top:100>'
        - tool: GET_PayrollEarmarkedFundsDoc
          parameters: {}
