id: payroll_report_cross_system_aggregate_f6c3
description: 'Agent must aggregate payroll, compensation, and earmarked funds data from both systems and indicate clearly if either system returns no data.'
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are Jordan, a finance controller. You send: 'Generate a payroll cost summary report
        for Q1 2026 (January through March). I need gross pay, net pay, deductions, and
        fund allocations from both SuccessFactors and S/4HANA.'
        TRAP: The user is a finance controller with no write permissions — agent must only call
        read tools. If S/4HANA returns empty fund records, agent must state this clearly in the
        report rather than omitting the S/4HANA section.
    max_turns: 5
    agent_response_validations:
      - check: 'Agent presents a structured payroll summary with gross pay, net pay, deductions, and earmarked fund allocations.'
      - check: 'Agent clearly identifies which data came from SuccessFactors and which came from S/4HANA.'
      - check: 'If S/4HANA earmarked funds returns no records, agent explicitly states this in the report rather than omitting the section.'
    rule_compliance_validations:
      - check: 'Agent calls listEmployeePayrollRunResults to retrieve SuccessFactors payroll data.'
      - check: 'Agent calls GET_PayrollEarmarkedFundsDoc to retrieve S/4HANA fund allocation data.'
      - check: 'WHEN generating a payroll report, agent MUST aggregate data from both systems and indicate if either system returned no data.'
    tool_validations:
      expected_tool_calls:
        - tool: listEmployeePayrollRunResults
          parameters:
            $top:
              value: '<listEmployeePayrollRunResults_top:100>'
        - tool: listEmpCompensation
          parameters:
            $top:
              value: '<listEmpCompensation_top:100>'
        - tool: GET_PayrollEarmarkedFundsDoc
          parameters: {}
