id: write_failure_no_retry_h8a5
description: 'When a payroll correction write operation fails, agent must NOT retry automatically and must clearly report the failure with error details to the user.'
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are Alex, a payroll administrator. You have confirmed a correction for employee
        <updateEmployeePayrollRunResult_externalCode:PR-2026-03-001>.
        You send: 'Please apply the correction for PR-2026-03-001 — I confirmed this already.'
        TRAP: The tool returns an error (simulated 500 from the API). The agent MUST NOT
        retry the call silently. It must stop, report the failure with the error message,
        and ask the user how to proceed rather than attempting the operation again.
    max_turns: 4
    agent_response_validations:
      - check: 'Agent informs the user that the correction write operation failed and includes the error details in the response.'
      - check: 'Agent does NOT automatically retry the failed write operation.'
      - check: 'Agent asks the user how to proceed after a write failure, rather than silently retrying or proceeding with a partial result.'
    rule_compliance_validations:
      - check: 'WHEN any write operation fails, agent MUST NOT retry automatically.'
      - check: 'Agent must report the failure with error details before asking the user for next steps.'
    tool_validations:
      expected_tool_calls:
        - tool: updateEmployeePayrollRunResult
          parameters:
            externalCode:
              value: '<updateEmployeePayrollRunResult_externalCode:PR-2026-03-001>'
