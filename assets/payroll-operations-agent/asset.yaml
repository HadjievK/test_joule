apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: payroll-operations-agent
  version: 1.0.0
  description: "AI agent for payroll operations across SAP SuccessFactors and SAP S/4HANA"

type: agent

container:
  buildPath: .
  port: 5000

requires:
  - name: employee-central-payroll-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.sf:apiResource:ECEmployeeCentralPayroll_MCP:v1
  - name: payroll-time-sheet-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.sf:apiResource:ECPayrollTimeSheets_MCP:v1
  - name: compensation-information-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.sf:apiResource:ECCompensationInformation_MCP:v1
  - name: compensation-management-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.sf:apiResource:employeeCompensation_MCP:v1
  - name: income-tax-declaration-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.sf:apiResource:ECIncomeTaxDeclaration_MCP:v1
  - name: payroll-earmarked-funds-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.s4:apiResource:CE_PAYROLLEARMARKEDFUNDSDOC_MCP:v1
  - name: statutory-reporting-task-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.s4:apiResource:CE_STATUTORYREPORTINGTASK_MCP:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
