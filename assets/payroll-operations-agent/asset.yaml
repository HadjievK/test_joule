apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: payroll-operations-agent
  version: 1.0.0
  description: AI agent that controls all payroll operations across SAP SuccessFactors and SAP HANA Cloud

type: agent

container:
  buildPath: .
  port: 5000
  env:
    HANA_HOST: "a3dacfda-9c88-4a95-9466-a995043a281d.hana.prod-eu12.hanacloud.ondemand.com"
    HANA_PORT: "443"
    HANA_USER: "DBADMIN"
    HANA_PASSWORD: "DBpass123+"

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
